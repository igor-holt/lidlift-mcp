[project]
name = "genesis-conductor-app"
version = "0.1.0"
description = "Unified Genesis Conductor console with seismic metrics and AI assistant integrations."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "httpx>=0.26.0",
  "pydantic>=2.6.0",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.uv]
